<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Detalhes do Filme — Cinemateca Pessoal</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="css/main.css" />
  <script>
    // A ficha do filme deixou de ser uma página e virou uma sobreposição
    // sobre a coleção, para o desfoque atrás ser a grade de verdade e o
    // fechar devolver o usuário onde ele estava. Esta página fica só para
    // não quebrar links antigos.
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      location.replace(id ? `index.html?film=${encodeURIComponent(id)}` : 'index.html');
    })();
  </script>
</head>
<body>
  <noscript>
    <p style="font-family:system-ui;padding:2rem">
      A ficha do filme agora abre dentro da coleção.
      <a href="index.html">Ir para a coleção</a>.
    </p>
  </noscript>
</body>
</html>
